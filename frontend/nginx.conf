server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed build assets never change under the same name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html names the hashed bundles, so caching it pins the whole app to
    # whatever was deployed when the browser last looked. A deploy changes the
    # asset names but not this file's name, and a cached copy keeps asking for
    # the old ones — the new build is live and nobody is running it.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        expires -1;
    }

    # Single-page app: unknown paths are routes, not missing files.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # Must exceed DOCUMENT_MAX_BYTES plus multipart overhead. nginx defaults
        # to 1m, which silently rejected every upload over ~1MB with an HTML
        # error page the app never saw.
        client_max_body_size 6m;

        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        # $http_host, not $host: $host drops the port, so a link the API
        # builds from the request comes out as http://localhost/ and does not
        # resolve. Set PUBLIC_BASE_URL for a real deployment — this header is
        # client-controlled, and only a link shown back to the requester
        # himself should ever be built from it.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Server-sent events: no buffering, no timeout, or streaming arrives
        # in one lump at the end instead of token by token.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        chunked_transfer_encoding on;

        # nginx answers an oversized body itself, so without this the browser
        # gets an HTML page where it expects the app's error envelope and shows
        # a generic failure instead of the actual limit.
        error_page 413 = @too_large;
    }

    location @too_large {
        default_type application/json;
        return 413 '{"error":{"code":"validation_error","message":"That file is too large. The limit is 5 MB per file."}}';
    }
}
