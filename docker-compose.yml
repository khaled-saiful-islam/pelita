name: pelita

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pelita}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pelita}
      POSTGRES_DB: ${POSTGRES_DB:-pelita}
    volumes:
      - pelita-db:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      # The API waits on this, which is what removes the "run migrations once
      # the database is actually up" manual step.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pelita} -d ${POSTGRES_DB:-pelita}"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  api:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-pelita}:${POSTGRES_PASSWORD:-pelita}@db:5432/${POSTGRES_DB:-pelita}
    env_file:
      - .env
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  web:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  pelita-db:
